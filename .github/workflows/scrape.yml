name: Scrape Mollimo cars

on:
  workflow_dispatch:

permissions:
  contents: write          

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true 

      - name: Install packages
        run: Rscript -e 'install.packages(c("httr", "jsonlite"))'

      - name: Scrape
        run: Rscript scrape_cars.R

      - name: Save CSVs to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mollimo_data
          git diff --cached --quiet || git commit -m "Scrape $(TZ=Europe/Budapest date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
