name: Scrape Mollimo cars

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:          # adds a "Run workflow" button for testing

permissions:
  contents: write             # allows the job to commit the CSVs

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # fast pre-built packages

      - name: Install packages
        run: Rscript -e 'install.packages(c("httr", "jsonlite"))'

      - name: Scrape
        run: Rscript scrape_cars.R

      - name: Save CSVs to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mollimo_data
          git diff --cached --quiet || git commit -m "Scrape $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
